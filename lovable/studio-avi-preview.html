const FAQ=[["כמה עולה אתר כזה?","אין מחירון אחיד, כי אין שני פרויקטים זהים. אתר תדמית מתחיל בדרך כלל באזור 8,000 ₪, וחוויה קולנועית מלאה עם עולם תלת מימד, רצפי תמונות ואנימציה נעה בטווח גבוה יותר. אחרי שיחה אחת קצרה תקבלו הצעת מחיר מפורטת, ללא עלות וללא התחייבות."],["כמה זמן לוקח לבנות?","דף נחיתה — שבועיים עד שלושה. אתר תדמית מלא — ארבעה עד שמונה שבועות, תלוי בכמות התוכן ובהיקף האנימציה. אני עובד על מספר פרויקטים מצומצם במקביל, כך שלוח הזמנים שנקבע בהתחלה הוא זה שנשמר."],["האם האתר יהיה מהיר גם עם כל האנימציות?","כן — זה בדיוק העניין. הכול נכתב ידנית בלי ספריות מיותרות ובלי בילדרים, אלמנטים תלת ממדיים נטענים ומותאמים במשקל הנכון למסך, התמונות נשלחות בפורמט WebP במידה המדויקת, והחוויות הכבדות נטענות ברקע בזמן שאתם כבר קוראים. האתר הזה עצמו נטען בכ-1.2 שניות."],["אני יכול לערוך את התוכן בעצמי אחר כך?","בהחלט. אם זה חשוב לכם, אני מחבר את האתר למערכת ניהול תוכן פשוטה שמאפשרת לעדכן טקסטים, תמונות ופרויקטים בלי לגעת בקוד. אם אתם מעדיפים שאני אטפל בעדכונים — יש גם מסלול ליווי חודשי."],["למי שייך האתר בסוף?","לכם. הקוד, העיצוב, הדומיין והחשבונות רשומים על שמכם ומועברים אליכם במסירה. אין נעילה לפלטפורמה שלי ואין דמי שימוש חודשיים כדי שהאתר פשוט ימשיך לעבוד."]];
const MENU=[[1,"פתיחה","מסך הכניסה"],[2,"הבידול","למה זה שונה"],[3,"הכניסה","אל מאחורי הדלת"],[4,"פרויקטים","הפורטפוליו"],[5,"אודות","מי עומד מאחורי זה"],[6,"שירותים","מה אני בונה"],[7,"תהליך","איך זה עובד"],[8,"שאלות נפוצות","מחיר, זמנים, בעלות"],[9,"יצירת קשר","הצעד האחרון"]];

film.addEventListener("ended",()=>{playing=false;const f=onEnd;onEnd=null;f&&f();});

function setClip(name,loop,cb){ film.loop=!!loop; onEnd=cb||null;
  film.src="public/video/"+name+(SMALL?"-sm":"")+".mp4"; film.load(); film.play().catch(()=>{}); }

const gold=(t)=>`<span class="bg-clip-text text-transparent" style="background-image:linear-gradient(96deg,hsl(var(--gold-dp)) 4%,hsl(var(--gold-hi)) 42%,hsl(var(--gold)) 78%);filter:drop-shadow(0 4px 30px hsl(var(--gold)/.35))">${t}</span>`;

function renderAct(){ const a=ACTS[act-1];
 document.getElementById("acts").innerHTML=`<section class="absolute inset-0 grid content-end justify-items-start px-[var(--gut)] pb-[clamp(124px,16vh,172px)] max-md:pb-[clamp(152px,20vh,196px)]"><div class="pointer-events-auto max-w-[min(560px,58vw)] max-lg:max-w-full">
 ${a.eyebrow?`<p class="mb-4 flex items-center gap-3.5 text-[11.5px] tracking-[.32em] text-gold-hi" style="text-shadow:0 2px 12px hsl(0 0% 0%/.9)">${a.eyebrow}<span class="h-px max-w-[56px] flex-1 bg-gold/25"></span></p>`:""}
 <h1 class="animate-rise-in font-display font-bold leading-[1.04] tracking-[-.015em] ${act===1?"text-[clamp(32px,4.9vw,64px)]":"text-[clamp(28px,3.9vw,52px)]"}" style="animation-delay:.25s;text-wrap:balance">
   <span class="block overflow-hidden" style="padding-block:.14em;margin-block:-.14em"><span class="block" style="text-shadow:0 4px 28px hsl(0 0% 0%/.95),0 2px 8px hsl(0 0% 0%/.85)">${a.lines[0]}</span></span>

 ${a.hint?`<span class="text-[12.5px] tracking-[.04em] text-ink-3 max-md:hidden">${a.hint}</span>`:""}</div></div></section>`;
 wireMagnetic(); }

function advance(){ if(playing)return; playing=true; const a=ACTS[act-1];
 setClip(a.clip,false,()=>{ if(act<3){act++;page=act;renderAct();syncUI();}
  else{ phase="gate"; page=4; dimmer.style.opacity=.3; renderGate(); syncUI(); } }); }

 const s=document.getElementById("story"); s.classList.remove("hidden");
 s.innerHTML=`<div class="grid min-h-[100dvh] content-center px-[var(--gut)] py-[clamp(74px,9vh,104px)] max-md:pb-[132px]">
  <div class="mx-auto mb-[clamp(24px,3vw,36px)] grid max-w-[720px] justify-items-center gap-5 text-center shadowtext">

   <h2 class="font-display text-[clamp(32px,4.8vw,64px)] font-bold leading-[1.08] tracking-[-.02em]">פרויקטים אחרונים</h2></div>

function card(p,i,compact){ return `<article class="proj group relative ${!compact&&i===1?"md:mt-[clamp(0px,4vw,52px)]":""} ${!compact&&i===2?"md:mt-[clamp(0px,8vw,104px)]":""}">

  <span class="absolute bottom-4 start-[18px] z-[3] inline-flex translate-y-2.5 items-center gap-2 rounded-full px-4 py-2.5 text-[12.5px] tracking-[.06em] text-ink-inverse opacity-0 transition-[opacity,transform] duration-500 ease-cinematic group-hover:translate-y-0 group-hover:opacity-100" style="background:linear-gradient(102deg,hsl(var(--gold-hi)),hsl(var(--gold)))">צפייה באתר ↗</span></a>
 ${compact?"":`<div class="px-1 pt-7 shadowtext"><h3 class="font-display text-[22px] font-bold tracking-[-.01em]">${p.title}</h3>
  <p class="mt-3.5 text-[15.5px] leading-[1.85] text-ink-2">${p.body}</p>

const head=(e,t,s,c)=>`<div class="mb-[clamp(48px,6vw,78px)] grid max-w-[760px] gap-5 shadowtext ${c?"mx-auto justify-items-center text-center":""}">

function buildStory(){ const s=document.getElementById("story"); s.classList.remove("hidden");
 s.innerHTML=`
 <section id="projects" class="${SEC}">${scrim()}${head("הפורטפוליו","פרויקטים אחרונים","שלושה מותגים שנכנסו פנימה ויצאו אחרת לגמרי. כל פרויקט נבנה בהתאמה אישית מלאה — מהרעיון הראשון ועד השורה האחרונה של הקוד, כדי להזיז מדדים, לא רק להיראות טוב.",1)}
  <div class="grid grid-cols-3 items-start gap-[clamp(20px,3vw,44px)] max-md:grid-cols-1 max-md:gap-16">${PROJECTS.map((p,i)=>`<div class="rv" style="transition-delay:${i*180}ms">${card(p,i,false)}</div>`).join("")}</div></section>

 <section id="about" class="${SEC}">${scrim()}
  <div class="grid grid-cols-[1.15fr_.85fr] items-start gap-[clamp(32px,5vw,80px)] max-lg:grid-cols-1 max-lg:gap-14">
   <div class="shadowtext"><p class="flex items-center gap-3.5 text-[12.5px] tracking-[.32em] text-gold-hi">אודות<span class="h-px max-w-[70px] flex-1 bg-gold/20"></span></p>

 <footer class="relative border-t border-foreground/10 backdrop-blur-lg" style="background:hsl(225 29% 3%/.72)">

   <div><h4 class="mb-5 text-[11.5px] tracking-[.24em] text-ink-3">ליצירת קשר</h4><ul class="grid gap-3"><li><a dir="ltr" href="mailto:${MAIL}" class="text-[14.5px] text-ink-2 transition-colors hover:text-gold">${MAIL}</a></li><li><a href="${WA}" target="_blank" rel="noopener" class="text-[14.5px] text-ink-2 transition-colors hover:text-gold">וואטסאפ</a></li></ul></div></div>

 document.querySelectorAll(".fld").forEach(el=>el.className=el.className.replace("fld","w-full rounded-xl border border-foreground/15 bg-foreground/[.04] px-4 py-[15px] text-[15.5px] text-foreground outline-none transition-all focus:border-gold focus:bg-gold/[.08]"));
 wireCards(); wireMagnetic(); revealObserver(); }

/* ===== אינטראקציות ===== */
function wireMagnetic(){ if(!FINE)return; document.querySelectorAll(".cine").forEach(b=>{
 b.onpointermove=e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.16}px,${(e.clientY-r.top-r.height/2)*.28-3}px)`;};
 b.onpointerleave=()=>b.style.transform="";});}
function wireCards(){ if(!FINE||CALM)return;
 document.querySelectorAll(".pcard").forEach(c=>{
  c.onpointermove=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
   c.style.setProperty("--mx",px*100+"%");c.style.setProperty("--my",py*100+"%");
   c.style.animationPlayState="paused";c.style.transition="transform .12s ease-out";
   c.style.transform=`translateY(-16px) perspective(900px) rotateX(${(.5-py)*14}deg) rotateY(${(px-.5)*14}deg)`;};
  c.onpointerleave=()=>{c.style.transform="";c.style.transition="";c.style.animationPlayState="";};});
 document.querySelectorAll(".spot").forEach(el=>{
  el.onpointermove=e=>{const r=el.getBoundingClientRect();el.style.setProperty("--mx",(e.clientX-r.left)/r.width*100+"%");el.style.setProperty("--my",(e.clientY-r.top)/r.height*100+"%");};});}
function revealObserver(){ const io=new IntersectionObserver(en=>en.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.15,rootMargin:"0px 0px -8% 0px"});
 document.querySelectorAll(".rv").forEach(el=>io.observe(el));
 requestAnimationFrame(()=>document.querySelectorAll(".rv:not(.in)").forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight*.92&&r.bottom>0)el.classList.add("in");}));
 wireTimeline();}

/* קו הזמן בתהליך נמשך עם הגלילה — מדמה את ה-ScrollTrigger בגרסת React */
function wireTimeline(){ const track=document.getElementById("track"), line=document.getElementById("tline");
 if(!track||!line)return; if(CALM){line.style.transform="scaleX(1)";return;}
 const upd=()=>{const r=track.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(innerHeight*.8-r.top)/(r.height*.65+innerHeight*.15)));
  line.style.transform=`scaleX(${p})`;};
 addEventListener("scroll",upd,{passive:true}); upd();}

function syncUI(){ document.getElementById("pagerNow").textContent=pad(page);
 document.getElementById("sideLabel").textContent=`PAGE ${pad(page)} OF 09`;
 document.querySelectorAll("[data-seg]").forEach(b=>{const on=+b.dataset.seg===page;
  b.className=`h-[3px] rounded-sm transition-all duration-300 ease-cinematic ${on?"w-7 max-md:w-5":"w-[15px] bg-foreground/20 hover:bg-gold/60 max-md:w-[11px]"}`;
  b.style.background=on?"linear-gradient(90deg,hsl(var(--gold-hi)),hsl(var(--gold-dp)))":"";
  b.style.boxShadow=on?"0 0 12px hsl(var(--gold)/.55)":"";});}

function jumpTo(n){ const bl=document.getElementById("blink"); bl.style.opacity=1;
 setTimeout(()=>{ setMenu(false);
  if(n<=3){ phase="acts"; act=n; page=n; playing=false; document.body.classList.add("is-locked");
   document.getElementById("story").classList.add("hidden"); document.getElementById("story").innerHTML="";
   dimmer.style.opacity=0; document.getElementById("cue").style.display="none";
   document.getElementById("skipBtn").style.display="";
   if(n===1){film.removeAttribute("src");film.load();} else setClip(ACTS[n-2].clip,false,null);
   renderAct();
  } else { phase="open"; page=n; document.body.classList.remove("is-locked");
   document.getElementById("acts").innerHTML="";   // אחרת שכבת המערכות נשארת מעל האתר
   document.getElementById("skipBtn").style.display="none";
   if(!document.getElementById("projects")) buildStory();
   setClip("s6",true); requestAnimationFrame(()=>{const el=document.getElementById(IDS[n]); if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-96,behavior:"auto"});}); }
  syncUI(); setTimeout(()=>bl.style.opacity=0,16); },150); }

function setMenu(open){ menuOpen=open; const m=document.getElementById("menu");
 m.className=m.className.replace(/(in)?visible|opacity-0|opacity-100/g,"").trim()+(open?" visible opacity-100":" invisible opacity-0");
 document.getElementById("botRail").style.opacity=open?0:1;
 document.querySelectorAll(".mi").forEach(li=>{li.style.opacity=open?1:0;li.style.transform=open?"none":"translateY(24px)";});
 document.getElementById("ml1").style.transform=open?"translateY(4px) rotate(45deg)":"";
 document.getElementById("ml2").style.width=open?"100%":"";
 document.getElementById("ml2").style.transform=open?"translateY(-4px) rotate(-45deg)":"";}
document.getElementById("menuBtn").onclick=()=>setMenu(!menuOpen);
addEventListener("keydown",e=>{if(e.key==="Escape"&&menuOpen)setMenu(false);});

addEventListener("scroll",()=>{ if(phase!=="open")return;
 const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
 document.getElementById("bar").style.width=(max>0?y/max*100:0)+"%";
 document.getElementById("topScrim").style.opacity=y>40?1:0;
 if(y>60)document.getElementById("cue").style.display="none";
 dimmer.style.opacity=Math.min(.84,y/(innerHeight*.75)*.84);
 const mid=innerHeight/2; let best=4,bd=1/0;
 for(const n in IDS){const el=document.getElementById(IDS[n]);if(!el)continue;const r=el.getBoundingClientRect();
  if(r.top<=mid&&r.bottom>=mid){best=+n;break;} const d=r.top>mid?r.top-mid:mid-r.bottom; if(d<bd){bd=d;best=+n;}}
 if(best!==page){page=best;syncUI();}},{passive:true});

renderAct(); syncUI();
</script>
